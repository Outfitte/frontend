name: Claude Implement Task

on:
  issues:
    types: [labeled]

jobs:
  claude-implement:
    if: github.event.label.name == 'claude implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Implement Task
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          plugin_marketplaces: |
            https://github.com/Outfitte/plugins.git
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            gh-cli@outfitte-plugins
            split-issue@outfitte-plugins
            implement-task@outfitte-plugins
            context7@claude-plugins-official
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(npm run build)",
                  "Bash(npm run dev)",
                  "Bash(npm run test)",
                  "Bash(npm run test:watch)",
                  "Bash(npm run test:coverage)",
                  "Bash(npm run lint)",
                  "Bash(npm run lint:fix)",
                  "Bash(npm run format)",
                  "Bash(npm run format:check)",
                  "Bash(npm ci)",
                  "Bash(npm install *)",
                  "Bash(npm create *)",
                  "Bash(npm test)",
                  "Bash(npx *)",
                  "Bash(node *)",
                  "Bash(docker build *)",
                  "Bash(docker compose *)",
                  "Bash(docker run *)",
                  "Bash(git *)",
                  "Bash(gh *)",
                  "Bash(make *)",
                  "Read(*)",
                  "Write(*)",
                  "Edit(*)",
                  "WebSearch"
                ],
                "deny": [
                  "Bash(git *--force*)",
                  "Bash(git * -f)",
                  "Bash(git * -f *)"
                ]
              }
            }
          prompt: |
            Use the /implement-task skill for issue #${{ github.event.issue.number }}.
